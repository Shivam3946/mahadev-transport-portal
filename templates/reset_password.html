{% extends "base.html" %}
{% block title %}Reset Password — MAHADEV TRANSPORT{% endblock %}
{% block content %}
<div style="max-width: 460px; margin: 24px auto;">
  <div class="card">
    <div class="card-header">🔑 पासवर्ड रीसेट / Reset Password</div>
    <form method="POST">
      <div style="margin-bottom: 10px;">
        <label>Username / यूज़रनेम</label>
        <input type="text" name="username" value="prakash" required />
      </div>
      <div style="margin-bottom: 10px;">
        <label>Admin Recovery Key / रिकवरी कोड</label>
        <input type="password" name="recovery_key" placeholder="Enter recovery key" required />
      </div>
      <div style="margin-bottom: 10px;">
        <label>New Password / नया पासवर्ड</label>
        <input type="password" name="new_password" minlength="6" required />
      </div>
      <div style="margin-bottom: 14px;">
        <label>Confirm New Password / पासवर्ड की पुष्टि करें</label>
        <input type="password" name="confirm_password" minlength="6" required />
      </div>
      <button type="submit" class="btn btn-navy" style="width: 100%; padding: 10px;">
        पासवर्ड रीसेट करें / Reset Password
      </button>
    </form>
    <div style="margin-top: 12px; text-align: center;">
      <a href="{{ url_for('login') }}" style="font-size: 0.86rem; color: var(--crimson); font-weight: 700;">
        ← वापस लॉगिन पर जाएं / Back to Login
      </a>
    </div>
  </div>
</div>
{% endblock %}
