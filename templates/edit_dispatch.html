{% extends "base.html" %}
{% block title %}Edit Challan #{{ entry.challan_no }} — MAHADEV TRANSPORT{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header">
    <span>✏️ चालान संपादित करें / Edit Challan #{{ entry.challan_no }} (Sr. {{ entry.sr_no }})</span>
    <a href="{{ url_for('dashboard') }}" class="btn btn-outline btn-sm">← Back to Dashboard</a>
  </div>
  <form method="POST">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px;">
      <div><label>Challan No.</label><input type="text" name="challan_no" value="{{ entry.challan_no }}" required /></div>
      <div><label>Dispatch Date</label><input type="date" name="dispatch_date" value="{{ entry.dispatch_date }}" required /></div>
      <div><label>Vehicle No.</label><input type="text" name="vehicle_no" value="{{ entry.vehicle_no }}" required /></div>
      <div><label>Driver Name</label><input type="text" name="driver_name" value="{{ entry.driver_name }}" required /></div>
      <div><label>Driver Mobile</label><input type="text" name="driver_mobile" value="{{ entry.driver_mobile }}" /></div>
      <div><label>Owner Mobile</label><input type="text" name="owner_mobile" value="{{ entry.owner_mobile }}" /></div>
      <div><label>From</label><input type="text" name="from_location" value="{{ entry.from_location }}" required /></div>
      <div><label>To</label><input type="text" name="to_location" value="{{ entry.to_location }}" required /></div>
      <div><label>Material</label><input type="text" name="material" value="{{ entry.material }}" /></div>
      <div><label>Weight / Qty</label><input type="number" step="0.01" name="qty" value="{{ entry.qty }}" required /></div>
      <div><label>Receive Weight</label><input type="text" name="receive_weight" value="{{ entry.receive_weight }}" /></div>
      <div><label>Rate (₹)</label><input type="number" step="0.01" name="rate" value="{{ entry.rate }}" required /></div>
      <div><label>Driver Advance (₹)</label><input type="number" step="0.01" name="driver_advance" value="{{ entry.driver_advance }}" /></div>
      <div><label>Diesel (₹)</label><input type="number" step="0.01" name="diesel" value="{{ entry.diesel }}" /></div>
      <div><label>Party Advance (₹)</label><input type="number" step="0.01" name="party_advance" value="{{ entry.party_advance }}" /></div>
      <div><label>Bilty Charge (₹)</label><input type="number" step="0.01" name="bilty_charge" value="{{ entry.bilty_charge }}" /></div>
      <div><label>A/c Transfer (₹)</label><input type="number" step="0.01" name="ac_transfer" value="{{ entry.ac_transfer }}" /></div>
      <div><label>Remarks</label><input type="text" name="remarks" value="{{ entry.remarks }}" /></div>
    </div>
    <div style="margin-top: 14px;">
      <button type="submit" class="btn btn-primary">💾 Update & Recalculate</button>
    </div>
  </form>
</div>
{% endblock %}
