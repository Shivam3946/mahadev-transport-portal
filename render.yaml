services:
  - type: web
    name: mahadev-transport-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mahadev-transport-db
          property: connectionString
      - key: ADMIN_RECOVERY_KEY
        value: MAHADEV-PRAKASH-2026

databases:
  - name: mahadev-transport-db
    plan: free
